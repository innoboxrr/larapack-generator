name: Release

# Se dispara solo si los tests pasaron. La version la declara el archivo
# VERSION y el tag se deriva de ella; Packagist publica al recibir el tag.
on:
    workflow_run:
        workflows: ['Tests']
        types: [completed]
        branches: [master]
    workflow_dispatch:

jobs:
    release:
        # `types: [completed]` dispara tambien cuando Tests fallo o se cancelo.
        # La puerta vive aqui y no solo en el reutilizable de innoboxrr/.github:
        # que un push con un test roto no publique es una garantia de este
        # repositorio, y tiene que poder leerse en el. A mano siempre se puede.
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

        # Explicito y no heredado: el reutilizable necesita `contents: write`
        # para empujar el tag, y un repositorio cuyo permiso por defecto sea de
        # solo lectura no puede concederselo. Eso no falla el job: falla el
        # arranque del workflow entero, sin log y sin explicacion.
        permissions:
            contents: write

        uses: innoboxrr/.github/.github/workflows/php-release.yml@main
