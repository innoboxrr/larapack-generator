name: Bump Semantic Tag on Master

# Se dispara cuando el workflow de Tests termina en master, no en cada push:
# etiquetar una version que no pasa los tests la publica rota en Packagist,
# y un tag no se puede despublicar.
on:
    workflow_run:
        workflows: ["Tests"]
        types: [completed]
        branches: [master]

jobs:
    bump-version:
        runs-on: ubuntu-latest
        if: >
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push'

        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0  # Necesario para obtener todos los tags
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Set up Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Get latest tag and bump version
              id: bump
              run: |
                  # El tag mas ALTO, no el mas reciente, y solo los que son
                  # semver de verdad: con --sort=-creatordate basta un tag
                  # v1.0.1 para que la lectura con IFS deje major='v1', que en
                  # aritmetica de bash vale 0, y el bump retroceda.
                  latestTag=$(git tag --list \
                      | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                      | sort -t. -k1,1n -k2,2n -k3,3n \
                      | tail -n 1)

                  if [ -z "$latestTag" ]; then
                      major=0
                      minor=0
                      patch=1
                  else
                      IFS='.' read -r major minor patch <<< "$latestTag"

                      # Obtener mensaje del último commit
                      commitMessage=$(git log -1 --pretty=%B)

                      # El marcador tiene que ir en su propia linea. Buscarlo
                      # en cualquier parte del texto significa que mencionarlo
                      # de pasada —"un commit #major sobre eso habria..."—
                      # dispara el salto de version. Es exactamente lo que paso
                      # al publicar innoboxrr/traits 2.0.0.
                      if echo "$commitMessage" | grep -qxE ' *#major *'; then
                          major=$((major + 1))
                          minor=0
                          patch=0
                      elif echo "$commitMessage" | grep -qxE ' *#minor *'; then
                          minor=$((minor + 1))
                          patch=0
                      else
                          patch=$((patch + 1))
                      fi
                  fi

                  newTag="$major.$minor.$patch"

                  echo "✅ Nuevo tag: $newTag"
                  echo "new_tag=$newTag" >> "$GITHUB_OUTPUT"

            - name: Create and push tag
              run: |
                  git tag ${{ steps.bump.outputs.new_tag }}
                  git push origin ${{ steps.bump.outputs.new_tag }}
