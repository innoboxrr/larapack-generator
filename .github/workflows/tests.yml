name: Tests

# La definicion vive en innoboxrr/.github para que sea la misma en todo el
# ecosistema. Aqui solo se declara cuando corre y sobre que versiones.
on:
    push:
        branches: [master]
    pull_request:

jobs:
    tests:
        uses: innoboxrr/.github/.github/workflows/php-tests.yml@main
        with:
            # 8.3 resuelve symfony/console 7.4 y 8.4+ resuelve 8.x, que tienen
            # firmas distintas en Command::configure(). La matriz existe
            # precisamente para cubrir esa diferencia.
            php-versions: '["8.3", "8.4", "8.5"]'

    # Claude Code ejecuta los hooks con Git Bash en Windows, y CLAUDE_PROJECT_DIR
    # llega como ruta de Windows. Ninguna prueba de PHPUnit pasa por ahí: este
    # job instala la guardia con larapack:skill --hooks y lanza el comando real
    # del hook, con las dos formas de ruta.
    windows-guard:
        name: Guardia en Windows (Git Bash)
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v5

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  # En Windows setup-php no trae fileinfo ni gd/zip activas, y
                  # phpoffice/phpspreadsheet (via maatwebsite/excel) las exige:
                  # sin ellas composer no resuelve.
                  extensions: fileinfo, gd, zip, mbstring, intl
                  coverage: none

            - name: Instalar dependencias
              shell: bash
              run: composer update --prefer-dist --no-interaction --no-progress

            - name: Pruebas de la guardia y de los hooks
              shell: bash
              run: vendor/bin/phpunit --no-progress --filter 'GuardTest|GuardHandRolledTest|AgentHooksTest|SkillTest'

            - name: El hook real, como lo lanza Claude Code
              shell: bash
              run: bash .github/scripts/guard-smoke.sh

    # El formato y los tipos no dependen de la versión de PHP: basta una vez.
    # Es lo mismo que LaraPack pone en la CI de cada paquete que crea.
    quality:
        name: Pint y Larastan
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none

            - name: Instalar dependencias
              run: composer update --prefer-dist --no-interaction --no-progress

            - name: Formato
              run: vendor/bin/pint --test

            - name: Análisis estático
              run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

    # Las pruebas de mutación de las piezas que sostienen la garantía
    # (infection.json5): que los tests comprueben lo que hacen, no sólo que lo
    # recorran. Infection se instala aparte y no en require-dev: trae su propio
    # php-parser y su Symfony, y sin composer.lock cambiaría lo que resuelve
    # cada versión de la matriz. Composer comprueba la firma de lo que baja.
    # Los umbrales son los logrados, redondeados hacia abajo: bajarlos para
    # pasar no es una salida (CONTRIBUTING, «Las pruebas de mutación»).
    mutation:
        name: Mutación
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: pcov

            - name: Instalar dependencias
              run: composer update --prefer-dist --no-interaction --no-progress

            - name: Instalar Infection
              run: |
                  mkdir -p "$RUNNER_TEMP/infection"
                  echo '{"config":{"allow-plugins":{"infection/extension-installer":false}}}' > "$RUNNER_TEMP/infection/composer.json"
                  composer require --working-dir="$RUNNER_TEMP/infection" --no-interaction --no-progress infection/infection:0.31.9

            - name: Pruebas de mutación
              run: >-
                  "$RUNNER_TEMP/infection/vendor/bin/infection"
                  --threads=max --only-covering-test-cases --no-progress
                  --min-msi=93 --min-covered-msi=93
