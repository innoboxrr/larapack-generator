name: Tests

# La definicion vive en innoboxrr/.github para que sea la misma en todo el
# ecosistema. Aqui solo se declara cuando corre y sobre que versiones.
on:
    push:
        branches: [master]
    pull_request:

jobs:
    tests:
        uses: innoboxrr/.github/.github/workflows/php-tests.yml@main
        with:
            # 8.3 resuelve symfony/console 7.4 y 8.4+ resuelve 8.x, que tienen
            # firmas distintas en Command::configure(). La matriz existe
            # precisamente para cubrir esa diferencia.
            php-versions: '["8.3", "8.4", "8.5"]'
